[project]
name = "file-digest-streamer"
version = "0.1.2"
description = "Computes an incremental hash digest of a file in fixed-size blocks to avoid loading large files into memory."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
